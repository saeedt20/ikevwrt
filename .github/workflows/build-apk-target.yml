name: Build target APK

on:
  workflow_dispatch:
    inputs:
      openwrt_release:
        description: Official OpenWrt 25.12 release, for example 25.12.5
        required: true
        default: "25.12.5"
        type: string
      target:
        description: Exact target/subtarget, for example mediatek/mt7622
        required: true
        default: "mediatek/mt7622"
        type: string

permissions:
  contents: read

jobs:
  build-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install OpenWrt SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential file gawk gettext libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev zstd
      - name: Build target-matched APK
        run: |
          ./scripts/build-apk-target.sh \
            "${{ inputs.openwrt_release }}" "${{ inputs.target }}"
      - name: Upload target APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luci-app-ikev2-manager-${{ inputs.openwrt_release }}-${{ inputs.target }}
          path: dist/apk/**
          if-no-files-found: error
