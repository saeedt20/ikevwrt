name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege by default; the job that publishes the release widens it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify tag
        run: ./scripts/check-release-tag.sh "${GITHUB_REF_NAME}"
      - name: Validate and build
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq mono-devel
          ./scripts/ci-check.sh
      - name: Install OpenWrt SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential file gawk gettext libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev zstd
      - name: Download verified OpenWrt 25.12 SDK
        run: |
          . ./apk-feed.env
          mkdir -p build
          curl --fail --location --silent --show-error \
            "https://downloads.openwrt.org/releases/${OPENWRT_APK_VERSION}/targets/${OPENWRT_APK_TARGET}/${OPENWRT_APK_SDK_ARCHIVE}" \
            --output "build/${OPENWRT_APK_SDK_ARCHIVE}"
          printf '%s  %s\n' \
            "$OPENWRT_APK_SDK_SHA256" "build/${OPENWRT_APK_SDK_ARCHIVE}" |
            sha256sum --check
          tar --use-compress-program=unzstd -xf \
            "build/${OPENWRT_APK_SDK_ARCHIVE}" -C build
      - name: Build unsigned OpenWrt 25.12 APK
        run: |
          . ./apk-feed.env
          OPENWRT_SDK_DIR="$PWD/build/${OPENWRT_APK_SDK_ARCHIVE%.tar.zst}" \
            ./scripts/build-apk.sh
      - name: Publish release assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '_rc') || contains(github.ref_name, '_beta') || contains(github.ref_name, '_alpha') }}
          files: |
            dist/apk/*
